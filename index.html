const rand=(a,b)=>a+Math.random()*(b-a);const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));

function resize(){

}
addEventListener('resize',resize,{passive:true});resize();
function stamp(x,y,h,amount=1,sat=90){
 const gx=Math.floor(x/cellW),gy=Math.floor(y/cellH);
 if(gx<0||gx>=cols||gy<0||gy>=rows)return;
 const p=light[gy*cols+gx];p.a=clamp(p.a+amount,0,1.65);p.h=h;p.s=sat;
}
class Spark{
 constructor(x,y,vx,vy,h,opts={}){
  this.x=x;this.y=y;this.px=x;this.py=y;this.vx=vx;this.vy=vy;this.h=h;
  this.life=opts.life??rand(0.7,1.55);this.age=0;
  this.drag=opts.drag??rand(0.72,1.65);this.size=opts.size??1;this.crackle=opts.crackle??false;
  this.twinkle=Math.random()*Math.PI*2;this.gravityScale=opts.gravityScale??1;this.sat=opts.sat??90;
 }
 update(dt){
  this.age+=dt;this.px=this.x;this.py=this.y;
  const damp=Math.exp(-this.drag*dt);this.vx*=damp;this.vy*=damp;
  this.vy+=state.gravity*this.gravityScale*dt;
  this.x+=this.vx*dt;this.y+=this.vy*dt;
  const left=clamp(1-this.age/this.life,0,1),twinkle=0.78+0.22*Math.sin(this.twinkle+this.age*25);
  const steps=Math.max(1,Math.ceil(Math.hypot(this.x-this.px,this.y-this.py)/Math.max(cellW,cellH)*1.4));
  for(let i=0;i<=steps;i++){
   const t=i/steps;
   stamp(this.px+(this.x-this.px)*t,this.py+(this.y-this.py)*t,this.h,(0.16+0.53*left)*this.size*twinkle/Math.sqrt(steps),this.sat);
  }
  if(this.crackle && left<0.42 && Math.random()<dt*1.6 && particles.length<2700){
   for(let n=0;n<3;n++)particles.push(new Spark(this.x,this.y,rand(-55,55),rand(-55,55),this.h+rand(-15,15),{life:rand(0.12,0.32),size:0.5,drag:3,gravityScale:0.4}));
   this.crackle=false;
  }
  return this.age<this.life && this.y<H+20;
 }
}

function explode(x,y,scale=1){
 const index=Math.floor(Math.random()*mascotPoints.length);
 bursts.push(new FaceBurst(x,y,index,scale));
 if(bursts.length>MAX_BURSTS)bursts.shift();
 const hue=[195,330,44][index];
 // 첫 번째 HTML의 폭발 섬광/외곽 링/잔광 효과를 유지.
 rings.push({x,y,r:0,max:rand(75,125)*state.power*scale,age:0,life:.55,h:hue});
 flashes.push({x,y,age:0,life:.22,h:hue});
 stamp(x,y,hue,1.6);
 for(let i=0;i<22;i++){
   const a=rand(0,Math.PI*2),speed=rand(70,154)*state.power;
   particles.push(new Spark(x,y,Math.cos(a)*speed,Math.sin(a)*speed,hue+rand(-14,14),
     {life:rand(.24,.6),size:rand(.35,.7),drag:1.7,gravityScale:.5}));
 }
 if(particles.length>1400) particles.splice(0,particles.length-1400);
}
function launch(tx=rand(W*0.12,W*0.88),ty=rand(H*0.16,H*0.63)){
 const sx=clamp(tx+rand(-W*0.15,W*0.15),W*0.05,W*0.95),sy=H+5;
 const duration=rand(0.62,1.05);
 rockets.push({sx,sy,tx,ty,t:0,duration,h:rand(0,360),prevX:sx,prevY:sy});
}
function rocketUpdate(dt){
 for(let i=rockets.length-1;i>=0;i--){
  const r=rockets[i];r.t+=dt;
  const t=clamp(r.t/r.duration,0,1),ease=1-Math.pow(1-t,1.5);
  const x=r.sx+(r.tx-r.sx)*ease,y=r.sy+(r.ty-r.sy)*ease;
  const segments=Math.max(1,Math.ceil(Math.hypot(x-r.prevX,y-r.prevY)/8));
  for(let j=0;j<=segments;j++){const z=j/segments;stamp(r.prevX+(x-r.prevX)*z,r.prevY+(y-r.prevY)*z,r.h,0.55)}
  if(Math.random()<0.65)particles.push(new Spark(x,y,rand(-22,22),rand(18,85),r.h,{life:rand(0.18,0.4),size:0.55,drag:3}));
  r.prevX=x;r.prevY=y;
  if(t>=1){explode(r.tx,r.ty);rockets.splice(i,1)}
 }
}
function drawGrid(dt){
 ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`bold ${Math.max(9,cellH-1)}px ui-monospace,Consolas,monospace`;
 const decay=Math.exp(-dt*3.4/state.trail);
 for(let i=0;i<light.length;i++){
  const p=light[i];p.a*=decay;
  if(p.a<0.016){p.a=0;continue}
  const x=(i%cols)*cellW+cellW/2,y=Math.floor(i/cols)*cellH+cellH/2;
  const strength=clamp(p.a,0,1),alpha=clamp(strength*state.opacity,0,1);
  if(alpha<0.012)continue;
  const brightness=Math.round(50+strength*46);
  const hue=((p.h%360)+360)%360;
  const glyph=glyphs[clamp(Math.floor(strength*8),0,8)];
  if(state.glow>0&&strength>0.22){
   ctx.shadowBlur=state.glow*1.6;ctx.shadowColor=`hsla(${hue},100%,65%,${alpha})`;
  }else ctx.shadowBlur=0;
  ctx.fillStyle=`hsla(${hue},${p.s}%,${brightness}%,${alpha})`;
  ctx.fillText(glyph,x,y);
 }
 ctx.shadowBlur=0;
}
function effectsUpdate(dt){
 ctx.save();ctx.globalCompositeOperation='lighter';
 for(let i=rings.length-1;i>=0;i--){
  const r=rings[i];r.age+=dt;let t=r.age/r.life;
  if(t>=1){rings.splice(i,1);continue}
  r.r=r.max*(1-Math.pow(1-t,2));
  ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);
  ctx.lineWidth=1.6*(1-t);ctx.strokeStyle=`hsla(${r.h},95%,77%,${(1-t)**2*0.4*state.opacity})`;
  ctx.stroke();
 }
 for(let i=flashes.length-1;i>=0;i--){
  const f=flashes[i];f.age+=dt;let t=f.age/f.life;
  if(t>=1){flashes.splice(i,1);continue}
  const radius=30+70*t;
  const g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,radius);
  g.addColorStop(0,`hsla(${f.h},100%,95%,${0.6*(1-t)**2*state.opacity})`);
  g.addColorStop(.22,`hsla(${f.h},100%,65%,${0.25*(1-t)**2*state.opacity})`);
  g.addColorStop(1,`hsla(${f.h},100%,45%,0)`);
  ctx.fillStyle=g;ctx.fillRect(f.x-radius,f.y-radius,radius*2,radius*2);
 }
 ctx.restore();
}
let previous=performance.now();
function frame(now){
 const dt=Math.min((now-previous)/1000,0.045);previous=now;elapsed+=dt;
 if(autoOn){autoClock-=dt;if(autoClock<=0){launch();autoClock=rand(0.38,0.85)}}
 rocketUpdate(dt);
 for(let i=particles.length-1;i>=0;i--)if(!particles[i].update(dt))particles.splice(i,1);
 drawGrid(dt);effectsUpdate(dt);
 for(let i=bursts.length-1;i>=0;i--)if(!bursts[i].update(dt))bursts.splice(i,1);
 for(const b of bursts)b.draw();
 requestAnimationFrame(frame);
}
canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect();explode(e.clientX-r.left,e.clientY-r.top,1.0)});
// 최초 실행 시 화면이 비어 보이지 않도록 즉시 폭발
setTimeout(()=>explode(W*.48,H*.38,1.1),220);
setTimeout(()=>explode(W*.69,H*.48,.8),680);
requestAnimationFrame(frame);
})();
</script>
